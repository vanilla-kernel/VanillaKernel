name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: LineageOS/android_kernel_oneplus_sm8350
  UPSTREAM_BRANCH: lineage-23.2
  DOWNSTREAM_BRANCH: lineage-23.2

jobs:
  sync:
    name: Merge upstream into downstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      sha: ${{ steps.merge.outputs.sha }}

    steps:
      - name: Checkout downstream branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DOWNSTREAM_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream branch
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          fi

          git fetch upstream "${UPSTREAM_BRANCH}"
          git checkout "${DOWNSTREAM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Downstream already contains upstream/${UPSTREAM_BRANCH}; nothing to do."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-ff "upstream/${UPSTREAM_BRANCH}" -m "Merge upstream/${UPSTREAM_BRANCH} into ${DOWNSTREAM_BRANCH}"; then
            echo "::error::Merge conflict merging upstream/${UPSTREAM_BRANCH} into ${DOWNSTREAM_BRANCH}; aborting."
            git merge --abort || true
            git status --porcelain
            exit 1
          fi

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push merged downstream branch
        if: steps.merge.outputs.merged == 'true'
        run: |
          git push origin "HEAD:${DOWNSTREAM_BRANCH}"

  release:
    name: Build and release
    runs-on: ubuntu-latest
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    timeout-minutes: 240
    permissions:
      contents: write
      actions: read

    steps:
      - name: Create patch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail

          prev="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name 2>/dev/null || true)"
          if ! printf '%s' "$prev" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            prev="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" -q '.[].tag_name' 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t . -k1,1n -k2,2n -k3,3n | tail -n 1 || true)"
          fi

          if [ -z "$prev" ]; then
            echo "::error::No previous semver release found"
            exit 1
          fi

          next="$(printf '%s' "$prev" | awk -F. -v OFS=. '{$(NF)=$(NF)+1}1')"

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${next}" >/dev/null 2>&1; then
            echo "::error::Release ${next} already exists"
            exit 1
          fi

          run_id=""
          for i in $(seq 1 60); do
            run_id="$(gh run list --workflow "Build Kernel" --branch "${DOWNSTREAM_BRANCH}" --limit 10 --json databaseId,headSha -q "[.[] | select(.headSha == \"${SHA}\")][0].databaseId // empty" || true)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 60
          done

          if [ -z "$run_id" ]; then
            echo "::error::Build run for ${SHA} not found"
            exit 1
          fi

          for i in $(seq 1 120); do
            status="$(gh run view "$run_id" --json status -q .status)"
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 90
          done

          conclusion="$(gh run view "$run_id" --json conclusion -q .conclusion)"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Build run ${run_id} finished with ${conclusion}"
            exit 1
          fi

          rm -rf dist
          gh run download "$run_id" -n VanillaKernel -D dist
          asset="$(ls dist/*.zip)"
          mv "$asset" "VanillaKernel-${next}.zip"

          body="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${next}
          **Minor update:**
          - Sync kernel with lineageos upstream"

          gh release create "$next" --title "V${next}" --notes "$body" --target "${SHA}" "VanillaKernel-${next}.zip"
